name: Sharesansar Historical Backfill

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Start year for backfill (e.g. 2019)"
        required: false
        default: "2019"
      symbol:
        description: "Single symbol to test (leave blank for all)"
        required: false
        default: ""
      limit:
        description: "Max symbols to process (0 = all)"
        required: false
        default: "0"

jobs:
  backfill_deep:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python db_manager.py

      - name: Sync stock list
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python data_collector.py --sync-stocks

      - name: Run MeroLagani backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          START_YEAR:   ${{ github.event.inputs.start_year || '2019' }}
        run: |
          SYMBOL="${{ github.event.inputs.symbol }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          if [ -n "$SYMBOL" ]; then
            echo "Testing single symbol: $SYMBOL"
            python merolagani_scraper.py --symbol "$SYMBOL" --start-year "$START_YEAR"
          else
            echo "Full backfill (limit=$LIMIT)"
            python merolagani_scraper.py --start-year "$START_YEAR" --limit "$LIMIT"
          fi

      - name: Report results
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'EOF'
          from db_manager import db
          result = db.one("SELECT COUNT(*) AS total, COUNT(DISTINCT symbol) AS symbols FROM daily_ohlcv")
          print(f"daily_ohlcv: {result['total']:,} rows across {result['symbols']} symbols")
          earliest = db.one("SELECT MIN(trade_date) AS earliest FROM daily_ohlcv")
          print(f"Earliest candle: {earliest['earliest']}")
          EOF

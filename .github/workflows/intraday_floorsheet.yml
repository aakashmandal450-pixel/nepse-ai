name: NEPSE Intraday Floorsheet

on:
  schedule:
    # Runs at 14:30 NPT every Sun–Thu (30 min before market close)
    # NPT = UTC+5:45, so 14:30 NPT = 08:45 UTC
    - cron: "45 8 * * 0,1,2,3,4"
  workflow_dispatch:   # allows manual trigger for testing

jobs:
  fetch_floorsheet:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python db_manager.py

      - name: Fetch floorsheet (market is open)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python data_collector.py --floorsheet-only
